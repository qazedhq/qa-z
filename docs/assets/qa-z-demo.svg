<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">QA-Z demo visual proof</title>
  <desc id="desc">Terminal-style QA-Z demo showing GitHub source install, auth-bug guard verdict do_not_merge, generated repair prompt, and verify improved result.</desc>
  <rect width="960" height="540" fill="#0f1419"/>
  <rect x="32" y="32" width="896" height="476" rx="14" fill="#151b22" stroke="#2d3742" stroke-width="2"/>
  <circle cx="64" cy="64" r="7" fill="#ff5f56"/>
  <circle cx="88" cy="64" r="7" fill="#ffbd2e"/>
  <circle cx="112" cy="64" r="7" fill="#27c93f"/>
  <text x="146" y="70" fill="#9fb3c8" font-family="Cascadia Mono, Consolas, monospace" font-size="18">QA-Z demo visual proof</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="17">
    <text x="64" y="116" fill="#8bd5ff">$ pipx install git+https://github.com/qazedhq/qa-z.git</text>
    <text x="64" y="148" fill="#d7e1ea">installed package qa-z from GitHub alpha source</text>
    <text x="64" y="180" fill="#8bd5ff">$ qa-z demo auth-bug</text>
    <text x="64" y="212" fill="#d7e1ea">created isolated demo: .qa-z/demo/auth-bug</text>
    <text x="64" y="244" fill="#8bd5ff">$ cd .qa-z/demo/auth-bug</text>
    <text x="64" y="276" fill="#8bd5ff">$ qa-z guard --from-run latest --adapter codex</text>
    <text x="64" y="310" fill="#ffdf5d">Verdict: do_not_merge</text>
    <text x="64" y="342" fill="#ffb86c">Reason: auth/owner-check risk detected</text>
    <text x="64" y="374" fill="#d7e1ea">Next: generated repair prompt</text>
    <text x="64" y="406" fill="#8bd5ff">$ qa-z repair-prompt --from-run latest --adapter codex</text>
    <text x="64" y="438" fill="#8bd5ff">$ qa-z verify --baseline-run baseline --candidate-run candidate</text>
    <text x="64" y="472" fill="#7ee787">verify verdict: improved</text>
    <text x="64" y="500" fill="#7ee787">resolved: py_test, sg_scan; blocking_after: 0</text>
  </g>
</svg>
