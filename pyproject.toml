[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-z"
version = "0.10.0b0"
description = "Deterministic QA gates for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "QA-Z Contributors" }]
keywords = [
  "ai",
  "code-review",
  "devsecops",
  "qa",
  "testing",
  "ci",
  "ai-agents",
  "coding-agents",
  "codex",
  "claude",
  "cursor",
  "semgrep",
  "sarif",
  "static-analysis",
  "quality-assurance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/qazedhq/qa-z"
Repository = "https://github.com/qazedhq/qa-z"
Issues = "https://github.com/qazedhq/qa-z/issues"
Releases = "https://github.com/qazedhq/qa-z/releases"
Documentation = "https://github.com/qazedhq/qa-z/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=9.0",
  "ruff==0.15.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
qa-z = "qa_z.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qa_z = [
  "templates/*.md",
  "templates/*.mdc",
  "templates/skills/qa-z-merge-safety/*.md",
  "templates/skills/qa-z-merge-safety/examples/*.md",
  "templates/examples/agent-auth-bug/*",
  "templates/examples/agent-auth-bug/app/*",
  "templates/examples/agent-auth-bug/repo/*",
  "templates/examples/agent-auth-bug/repo/app/*",
  "templates/examples/agent-auth-bug/repo/semgrep-rules/*",
  "templates/examples/agent-auth-bug/repo/tests/*",
  "templates/examples/agent-auth-bug/semgrep-rules/*",
  "templates/examples/agent-auth-bug/tests/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
