rules:
  - id: qa-z.auth-bypass-any-authenticated-user
    message: Authorization must compare the actor to the invoice owner, not only check that the actor is signed in.
    severity: ERROR
    languages:
      - python
    pattern: |
      return $ACTOR is not None
  - id: qa-z.auth-bypass-missing-owner-check
    message: Authorization helper accepts an invoice but never checks the actor against invoice.owner_id.
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern: |
          def $FUNC($ACTOR, $INVOICE, ...):
              ...
              if $ACTOR is None:
                  return False
              ...
      - metavariable-regex:
          metavariable: $ACTOR
          regex: ^actor_id$
      - metavariable-regex:
          metavariable: $INVOICE
          regex: ^invoice$
      - pattern-not: |
          def $FUNC($ACTOR, $INVOICE, ...):
              ...
              return $ACTOR == $INVOICE.owner_id
              ...
      - pattern-not: |
          def $FUNC($ACTOR, $INVOICE, ...):
              ...
              return $INVOICE.owner_id == $ACTOR
              ...
