# Keep approval_policy and sandbox_mode in the invoking user/session profile; do not hard-code dangerous repo defaults.
project_root_markers = [".git"]
project_doc_fallback_filenames = ["AGENTS.md", "TEAM_GUIDE.md", ".agents.md"]
project_doc_max_bytes = 65536

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 900

[features]
multi_agent = true
