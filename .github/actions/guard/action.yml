name: QA-Z Guard
description: Run QA-Z guard and preserve deterministic merge evidence.

inputs:
  profile:
    default: python
    required: false
    description: Project profile.
  deep:
    default: auto
    required: false
    description: Deep-check policy.
  adapter:
    default: codex
    required: false
    description: Repair adapter.
  fail-on-risk:
    default: "true"
    required: false
    description: Exit nonzero for blocking guard verdicts.
  upload-sarif:
    default: "false"
    required: false
    description: Upload SARIF when deep checks produce it. Requires security-events write permission.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install QA-Z
      shell: bash
      run: python -m pip install git+https://github.com/qazedhq/qa-z.git

    - name: Validate QA-Z config
      shell: bash
      run: qa-z doctor --json

    - name: Run QA-Z guard
      shell: bash
      run: |
        args=(qa-z guard --deep "${{ inputs.deep }}" --adapter "${{ inputs.adapter }}" --github-summary)
        if [ "${{ inputs.fail-on-risk }}" = "true" ]; then
          args+=(--fail-on-risk)
        fi
        "${args[@]}"

    - name: Publish QA-Z summary
      if: ${{ always() }}
      shell: bash
      run: |
        if [ -f .qa-z/runs/latest/guard/github-summary.md ]; then
          cat .qa-z/runs/latest/guard/github-summary.md >> "$GITHUB_STEP_SUMMARY"
        elif [ -f .qa-z/runs/latest/guard/verdict.md ]; then
          cat .qa-z/runs/latest/guard/verdict.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload QA-Z SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: .qa-z/runs/latest/deep/results.sarif
        category: qa-z-semgrep

    - name: Upload QA-Z artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: qa-z-runs
        path: .qa-z/runs/latest
        retention-days: 7
        if-no-files-found: warn
