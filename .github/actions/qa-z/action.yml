name: QA-Z Gate
description: Run QA-Z fast/deep checks and publish local review artifacts.

inputs:
  qa-z-install:
    description: Python package spec used to install QA-Z.
    required: false
    default: git+https://github.com/qazedhq/qa-z.git@v0.9.9-alpha
  run-dir:
    description: QA-Z run artifact directory.
    required: false
    default: .qa-z/runs/pr
  adapter:
    description: Repair prompt adapter.
    required: false
    default: codex
  upload-sarif:
    description: Upload deep/results.sarif to code scanning. Requires security-events write permission.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate QA-Z action inputs
      shell: bash
      run: |
        docs_url="https://github.com/qazedhq/qa-z/blob/main/docs/github-action.md#troubleshooting-faq"
        fail_input() {
          local input_name="$1"
          local input_value="$2"
          local supported_values="$3"
          local suggested_fix="$4"
          echo "::error title=Invalid QA-Z action input::Invalid QA-Z action input: ${input_name}. Received '${input_value}'. supported values: ${supported_values}. Suggested fix: ${suggested_fix}. Docs: ${docs_url}"
          echo "Invalid QA-Z action input: ${input_name}" >&2
          echo "Received: ${input_value}" >&2
          echo "supported values: ${supported_values}" >&2
          echo "Suggested fix: ${suggested_fix}" >&2
          echo "Docs: ${docs_url}" >&2
          exit 2
        }

        case "${{ inputs.adapter }}" in
          legacy|codex|claude) ;;
          *)
            fail_input "adapter" "${{ inputs.adapter }}" "legacy, codex, claude" "set adapter to codex for the default repair handoff"
            ;;
        esac

        case "${{ inputs.upload-sarif }}" in
          true|false) ;;
          *)
            fail_input "upload-sarif" "${{ inputs.upload-sarif }}" "true, false" "quote the boolean, for example upload-sarif: \"false\""
            ;;
        esac

        run_dir="${{ inputs.run-dir }}"
        if [[ "$run_dir" =~ ^[[:space:]]*$ || "$run_dir" = /* || "$run_dir" = *".."* ]]; then
          fail_input "run-dir" "$run_dir" "a repository-relative path such as .qa-z/runs/pr" "set run-dir to a repository-relative .qa-z path"
        fi

        if [ "${{ inputs.upload-sarif }}" = "true" ]; then
          echo "::notice title=QA-Z SARIF upload enabled::Ensure this job has permissions: security-events: write. Docs: ${docs_url}"
        fi

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install QA-Z and Semgrep
      shell: bash
      run: python -m pip install "${{ inputs.qa-z-install }}" semgrep

    - name: Validate QA-Z config
      shell: bash
      run: qa-z doctor --json

    - name: Run fast checks
      shell: bash
      run: |
        mkdir -p "${{ inputs.run-dir }}"
        set +e
        qa-z fast --selection smart --output-dir "${{ inputs.run-dir }}" --json | tee "${{ inputs.run-dir }}/fast-stdout.json"
        fast_exit=${PIPESTATUS[0]}
        set -e
        echo "$fast_exit" > "${{ inputs.run-dir }}/fast-exit-code"

    - name: Run deep checks
      if: ${{ always() }}
      shell: bash
      run: |
        mkdir -p "${{ inputs.run-dir }}"
        set +e
        qa-z deep --selection smart --from-run "${{ inputs.run-dir }}" --json | tee "${{ inputs.run-dir }}/deep-stdout.json"
        deep_exit=${PIPESTATUS[0]}
        set -e
        echo "$deep_exit" > "${{ inputs.run-dir }}/deep-exit-code"

    - name: Generate review and repair artifacts
      if: ${{ always() }}
      shell: bash
      run: |
        mkdir -p "${{ inputs.run-dir }}/review" "${{ inputs.run-dir }}/repair"
        qa-z review --from-run "${{ inputs.run-dir }}" --output-dir "${{ inputs.run-dir }}/review" > "${{ inputs.run-dir }}/review/review-stdout.md" || true
        qa-z repair-prompt --from-run "${{ inputs.run-dir }}" --adapter "${{ inputs.adapter }}" --output-dir "${{ inputs.run-dir }}/repair" > "${{ inputs.run-dir }}/repair/prompt-stdout.md" || true

    - name: Publish QA-Z job summary
      if: ${{ always() }}
      shell: bash
      run: |
        qa-z github-summary --from-run "${{ inputs.run-dir }}" --output "${{ inputs.run-dir }}/github-summary.md" > "${{ inputs.run-dir }}/github-summary-stdout.md" || true
        if [ -f "${{ inputs.run-dir }}/github-summary.md" ]; then
          cat "${{ inputs.run-dir }}/github-summary.md" >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "# QA-Z Summary"
            echo ""
            echo "QA-Z did not produce a summary artifact."
            echo ""
            echo "## Missing Evidence"
            echo ""
            echo "- Expected run directory: \`${{ inputs.run-dir }}\`"
            echo "- Expected fast summary: \`${{ inputs.run-dir }}/fast/summary.json\`"
            echo "- Expected deep summary: \`${{ inputs.run-dir }}/deep/summary.json\`"
            echo "- Repair prompt artifact path: \`${{ inputs.run-dir }}/repair/prompt.md\`"
            echo "- Review packet artifact path: \`${{ inputs.run-dir }}/review/review.md\`"
            echo "- SARIF artifact path: \`${{ inputs.run-dir }}/deep/results.sarif\`"
            echo ""
            echo "## Next Actions"
            echo ""
            echo "1. Check the fast and deep log steps for the first failure."
            echo "2. Run \`qa-z doctor --json\` locally."
            echo "3. Run \`qa-z summary --from-run ${{ inputs.run-dir }}\` locally if artifacts exist."
            echo ""
            echo "SARIF upload is skipped unless \`upload-sarif: \"true\"\` is set; when enabled, the job needs \`security-events: write\`."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload QA-Z SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.run-dir }}/deep/results.sarif
        category: qa-z-semgrep

    - name: Upload QA-Z run artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: qa-z-runs
        path: ${{ inputs.run-dir }}
        retention-days: 7
        if-no-files-found: warn

    - name: Fail if QA-Z fast or deep failed
      if: ${{ always() }}
      shell: bash
      run: |
        fast_exit=1
        deep_exit=1
        if [ -f "${{ inputs.run-dir }}/fast-exit-code" ]; then
          fast_exit="$(cat "${{ inputs.run-dir }}/fast-exit-code")"
        fi
        if [ -f "${{ inputs.run-dir }}/deep-exit-code" ]; then
          deep_exit="$(cat "${{ inputs.run-dir }}/deep-exit-code")"
        fi
        if [ "$fast_exit" -ne 0 ] || [ "$deep_exit" -ne 0 ]; then
          echo "QA-Z checks failed: fast=$fast_exit deep=$deep_exit"
          exit 1
        fi
